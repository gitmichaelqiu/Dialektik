[package]
name = "dialektik"
version = "1.0.0"
description = "Local-first debate preparation and round workspace"
authors = ["Dialektik"]
edition = "2021"

[lib]
name = "dialektik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
